kind = "mobile"
previewPath = "/mobile/"
title = "ScenePulse Mobile"
version = "1.0.0"
id = "artifacts/scene-pulse-mobile"
router = "expo-domain"

[[services]]
name = "expo"
ensurePreviewReachable = "/status"
paths = [ "/mobile/" ]
localPort = 18377

[services.development]
run = "pnpm --filter @workspace/scene-pulse-mobile run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/scene-pulse-mobile", "run", "build" ]
run = [ "pnpm", "--filter", "@workspace/scene-pulse-mobile", "run", "serve" ]

[services.env]
PORT = "18377"
BASE_PATH = "/mobile/"
