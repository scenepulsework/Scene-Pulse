openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: ScenePulse API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: venues
    description: Venue conditions and directory
  - name: comments
    description: Real-time venue comments
  - name: reports
    description: Live crowd/wait/vibe report submissions
  - name: markets
    description: Market metadata and coverage
  - name: watchlist
    description: Signed-in user's saved venues and activity
  - name: stats
    description: Dashboard and hero aggregates
  - name: Storage
    description: Object storage upload and serving endpoints.
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /venues:
    get:
      operationId: listVenues
      tags: [venues]
      summary: List venues
      description: List venues with optional filtering, search, and sorting
      parameters:
        - name: market
          in: query
          schema: { type: string }
        - name: category
          in: query
          schema: { type: string }
        - name: search
          in: query
          schema: { type: string }
        - name: sort
          in: query
          description: Sort order for results
          schema:
            type: string
            enum: [crowdScore, waitTime, rating, name, updated]
        - name: intent
          in: query
          description: Quick-pick user intent tag to filter by
          schema:
            type: string
            enum: [dateNight, noWait, retailDrops, liveMusic, patioEnergy, lateNightFood, speakeasy, interactiveBars]
      responses:
        "200":
          description: List of venues
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Venue"

  /venues/{id}:
    get:
      operationId: getVenue
      tags: [venues]
      summary: Get a venue
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: Venue detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Venue"
        "404":
          description: Not found

    patch:
      operationId: updateVenue
      tags: [venues]
      summary: Update a claimed venue's details (operator only)
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VenueUpdate"
      responses:
        "200":
          description: Updated venue
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Venue"
        "401":
          description: Not authenticated
        "403":
          description: Venue not claimed by this operator
        "404":
          description: Not found

  /venues/{id}/claim:
    post:
      operationId: claimVenue
      tags: [venues]
      summary: Claim a venue as its operator
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        "201":
          description: Claim created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VenueClaim"
        "401":
          description: Not authenticated
        "404":
          description: Venue not found
        "409":
          description: Venue already claimed by another operator
    delete:
      operationId: cancelVenueClaim
      tags: [venues]
      summary: Cancel your own pending claim on a venue
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        "204":
          description: Pending claim cancelled
        "401":
          description: Not authenticated
        "404":
          description: No pending claim by this operator for this venue

  /venues/{id}/claim/verify:
    post:
      operationId: verifyVenueClaim
      tags: [venues]
      summary: Verify a pending venue claim with the confirmation code
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VenueClaimVerification"
      responses:
        "200":
          description: Claim verified
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VenueClaim"
        "400":
          description: Incorrect verification code
        "401":
          description: Not authenticated
        "404":
          description: No pending claim by this operator for this venue

  /operator/venues:
    get:
      operationId: listOperatorVenues
      tags: [venues]
      summary: List venues claimed by the current operator
      responses:
        "200":
          description: Claimed venues
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/OperatorVenue"
        "401":
          description: Not authenticated

  /watchlist:
    get:
      operationId: listWatchlist
      tags: [watchlist]
      summary: List the current user's watchlisted venues
      responses:
        "200":
          description: Watchlisted venues (includes alertsEnabled preference per entry)
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/WatchlistedVenue"
        "401":
          description: Not authenticated

  /watchlist/{venueId}:
    post:
      operationId: addToWatchlist
      tags: [watchlist]
      summary: Add a venue to the current user's watchlist
      parameters:
        - name: venueId
          in: path
          required: true
          schema: { type: integer }
      responses:
        "201":
          description: Added (idempotent — also returned if already present)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WatchlistEntry"
        "401":
          description: Not authenticated
        "404":
          description: Venue not found
    delete:
      operationId: removeFromWatchlist
      tags: [watchlist]
      summary: Remove a venue from the current user's watchlist
      parameters:
        - name: venueId
          in: path
          required: true
          schema: { type: integer }
      responses:
        "204":
          description: Removed
        "401":
          description: Not authenticated

  /watchlist/{venueId}/alerts:
    put:
      operationId: setWatchlistAlerts
      tags: [watchlist]
      summary: Enable or disable crowd alerts for a watchlisted venue
      parameters:
        - name: venueId
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WatchlistAlertsInput"
      responses:
        "200":
          description: Updated alert preference
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WatchlistEntry"
        "401":
          description: Not authenticated
        "404":
          description: Venue not in watchlist

  /notifications:
    get:
      operationId: listNotifications
      tags: [watchlist]
      summary: List in-app notifications for the current user
      responses:
        "200":
          description: List of notifications
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/VenueNotification"
        "401":
          description: Not authenticated

  /notifications/read-all:
    put:
      operationId: markAllNotificationsRead
      tags: [watchlist]
      summary: Mark all notifications as read
      responses:
        "204":
          description: All marked read
        "401":
          description: Not authenticated

  /notifications/{id}/read:
    put:
      operationId: markNotificationRead
      tags: [watchlist]
      summary: Mark a single notification as read
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: Updated notification
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VenueNotification"
        "401":
          description: Not authenticated
        "404":
          description: Not found

  /me/activity:
    get:
      operationId: getMyActivity
      tags: [watchlist]
      summary: Current user's past reports and comments
      responses:
        "200":
          description: The user's activity
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MyActivity"
        "401":
          description: Not authenticated

  /markets:
    get:
      operationId: listMarkets
      tags: [markets]
      summary: List markets covered
      description: Distinct markets with venue counts
      responses:
        "200":
          description: List of markets
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Market"

  /stats/hero:
    get:
      operationId: getHeroStats
      tags: [stats]
      summary: Hero dashboard stats
      description: Top-line aggregates for the hero dashboard
      responses:
        "200":
          description: Hero stats
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HeroStats"

  /stats/hot-zones:
    get:
      operationId: getHotZones
      tags: [stats]
      summary: Hot zone highlights
      description: Hottest pin, fastest move, and most open venue for the Scene Map
      parameters:
        - name: market
          in: query
          schema: { type: string }
      responses:
        "200":
          description: Hot zone highlights
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HotZones"

  /market-gaps:
    get:
      operationId: listMarketGaps
      tags: [markets]
      summary: Hospitality market gaps
      description: Industry gap notes ScenePulse addresses
      responses:
        "200":
          description: List of market gaps
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/MarketGap"

  /venues/{venueId}/comments:
    get:
      operationId: listVenueComments
      tags: [comments]
      summary: List comments for a venue
      parameters:
        - name: venueId
          in: path
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: List of comments
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Comment"
    post:
      operationId: createVenueComment
      tags: [comments]
      summary: Post a comment on a venue's live scene
      parameters:
        - name: venueId
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CommentInput"
      responses:
        "201":
          description: Created comment
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Comment"
        "404":
          description: Venue not found

  /venues/{venueId}/reports:
    get:
      operationId: listVenueReports
      tags: [reports]
      summary: List recent live reports for a venue
      parameters:
        - name: venueId
          in: path
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: List of live reports
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/LiveReport"
    post:
      operationId: createVenueReport
      tags: [reports]
      summary: Submit a live crowd/wait/vibe report for a venue
      description: Updates the venue's live condition snapshot in addition to logging the report
      parameters:
        - name: venueId
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LiveReportInput"
      responses:
        "201":
          description: Created live report
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LiveReport"
        "404":
          description: Venue not found

  /venues/{venueId}/comments/{commentId}/like:
    post:
      operationId: likeComment
      tags: [comments]
      summary: Like a comment
      parameters:
        - name: venueId
          in: path
          required: true
          schema: { type: integer }
        - name: commentId
          in: path
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: Updated comment
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Comment"
        "404":
          description: Not found

  /venues/{venueId}/comments/{commentId}/dislike:
    post:
      operationId: dislikeComment
      tags: [comments]
      summary: Dislike a comment
      parameters:
        - name: venueId
          in: path
          required: true
          schema: { type: integer }
        - name: commentId
          in: path
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: Updated comment
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Comment"
        "404":
          description: Not found

  /storage/uploads/request-url:
    post:
      tags: [Storage]
      operationId: requestUploadUrl
      summary: Request a presigned URL for file upload
      description: |
        Returns a presigned GCS URL for direct upload. The client sends JSON
        metadata here, then uploads the file directly to the returned URL.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UploadUrlRequest'
      responses:
        '200':
          description: Presigned upload URL generated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UploadUrlResponse'
        '400':
          description: Missing or invalid required fields.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '401':
          description: Not authenticated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '500':
          description: Failed to generate upload URL.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /storage/public-objects/{filePath}:
    get:
      tags: [Storage]
      operationId: getPublicObject
      summary: Serve a public asset from PUBLIC_OBJECT_SEARCH_PATHS
      description: |
        Unconditionally public — no authentication or ACL checks.
        Searches PUBLIC_OBJECT_SEARCH_PATHS for the given file path.
      parameters:
        - name: filePath
          in: path
          required: true
          schema:
            type: string
          description: Relative file path within the public search paths.
      responses:
        '200':
          description: Object content streamed with correct Content-Type.
          content:
            '*/*':
              schema:
                type: string
                format: binary
        '404':
          description: File not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '500':
          description: Failed to serve public object.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /storage/objects/{objectPath}:
    get:
      tags: [Storage]
      operationId: getStorageObject
      summary: Serve an object entity from PRIVATE_OBJECT_DIR
      description: |
        Serves object entities uploaded via presigned URLs.
      parameters:
        - name: objectPath
          in: path
          required: true
          schema:
            type: string
          description: Object path within the private object dir (e.g. `uploads/some-uuid`).
      responses:
        '200':
          description: Object content streamed with correct Content-Type.
          content:
            '*/*':
              schema:
                type: string
                format: binary
        '404':
          description: Object not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '500':
          description: Failed to serve object.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'

components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

    Venue:
      type: object
      required:
        - id
        - name
        - category
        - city
        - market
        - region
        - country
        - latitude
        - longitude
        - address
        - rating
        - crowdScore
        - crowdLevel
        - waitTimeMinutes
        - headcount
        - lineTrend
        - seatingOdds
        - noiseLevel
        - coverCost
        - bestTimeWindow
        - bestFor
        - operatorGapNote
        - peakPressureWindow
        - reservationSignal
        - staffingSignal
        - dataSignalsTracked
        - arrivalTips
        - photos
        - isWatchlisted
        - updatedAt
      properties:
        id: { type: integer }
        name: { type: string }
        category:
          type: string
          enum: [bar, restaurant, retail, cafe, experience]
        city: { type: string }
        market: { type: string }
        region: { type: string }
        country: { type: string }
        latitude: { type: number }
        longitude: { type: number }
        address: { type: string }
        rating: { type: number }
        crowdScore:
          type: integer
          description: 0-100 crowd pressure score
        crowdLevel:
          type: string
          enum: [open, lively, packed]
        waitTimeMinutes: { type: integer }
        headcount: { type: integer }
        lineTrend:
          type: string
          enum: [rising, falling, steady]
        seatingOdds: { type: string }
        noiseLevel:
          type: string
          enum: [quiet, moderate, loud]
        coverCost: { type: string }
        bestTimeWindow: { type: string }
        bestFor:
          type: array
          items: { type: string }
        operatorGapNote: { type: string }
        peakPressureWindow: { type: string }
        reservationSignal: { type: string }
        staffingSignal: { type: string }
        dataSignalsTracked:
          type: array
          items: { type: string }
        arrivalTips:
          type: array
          items: { type: string }
        photos:
          type: array
          items: { type: string }
          description: Object storage paths (e.g. /objects/uploads/uuid) served via /api/storage
        openingHours:
          oneOf:
            - $ref: "#/components/schemas/OpeningHours"
            - type: "null"
        sourceLabel: { type: ["string", "null"] }
        sourceUrl: { type: ["string", "null"] }
        mapsUrl: { type: string }
        isWatchlisted: { type: boolean }
        updatedAt: { type: string, format: date-time }

    VenueUpdate:
      type: object
      properties:
        name: { type: string, minLength: 1 }
        address: { type: string, minLength: 1 }
        category:
          type: string
          enum: [bar, restaurant, retail, cafe, experience]
        bestFor:
          type: array
          items: { type: string }
        coverCost: { type: string, minLength: 1 }
        noiseLevel:
          type: string
          enum: [quiet, moderate, loud]
        photos:
          type: array
          maxItems: 8
          items: { type: string }
          description: Object storage paths (e.g. /objects/uploads/uuid)
        openingHours:
          oneOf:
            - $ref: "#/components/schemas/OpeningHours"
            - type: "null"

    OpeningHours:
      type: object
      description: Per-day opening hours, free-text (e.g. "5pm – 2am" or "Closed")
      required: [monday, tuesday, wednesday, thursday, friday, saturday, sunday]
      properties:
        monday: { type: string }
        tuesday: { type: string }
        wednesday: { type: string }
        thursday: { type: string }
        friday: { type: string }
        saturday: { type: string }
        sunday: { type: string }

    UploadUrlRequest:
      type: object
      required: [name, size, contentType]
      properties:
        name:
          type: string
          minLength: 1
          description: Original file name.
        size:
          type: integer
          minimum: 1
          description: File size in bytes.
        contentType:
          type: string
          minLength: 1
          description: MIME type of the file (e.g. `image/jpeg`).
    UploadUrlResponse:
      type: object
      required: [uploadURL, objectPath]
      properties:
        uploadURL:
          type: string
          description: Presigned GCS URL for PUT upload.
        objectPath:
          type: string
          description: Normalized object path (e.g. `/objects/uploads/uuid`). Store this in your database.
        metadata:
          $ref: '#/components/schemas/UploadUrlRequest'
    ErrorEnvelope:
      type: object
      required: [error]
      properties:
        error:
          type: string

    VenueClaim:
      type: object
      required: [id, venueId, operatorUserId, status, createdAt]
      properties:
        id: { type: integer }
        venueId: { type: integer }
        operatorUserId: { type: string }
        status:
          type: string
          enum: [pending, verified]
        verifiedAt: { type: ["string", "null"], format: date-time }
        expiresAt: { type: ["string", "null"], format: date-time }
        devVerificationCode:
          type: string
          description: Verification code, exposed only in development while no email provider is connected
        createdAt: { type: string, format: date-time }

    VenueClaimVerification:
      type: object
      required: [code]
      properties:
        code: { type: string, minLength: 6, maxLength: 6 }

    OperatorVenue:
      allOf:
        - $ref: "#/components/schemas/Venue"
        - type: object
          required: [claimStatus]
          properties:
            claimStatus:
              type: string
              enum: [pending, verified]

    Market:
      type: object
      required: [market, city, region, country, venueCount]
      properties:
        market: { type: string }
        city: { type: string }
        region: { type: string }
        country: { type: string }
        venueCount: { type: integer }

    HeroStats:
      type: object
      required:
        - totalVenues
        - marketsCovered
        - liveReportsToday
        - averageCrowdScore
        - packedNow
        - openNow
      properties:
        totalVenues: { type: integer }
        marketsCovered: { type: integer }
        liveReportsToday: { type: integer }
        averageCrowdScore: { type: number }
        packedNow: { type: integer }
        openNow: { type: integer }

    HotZones:
      type: object
      required: [hottestPin, fastestMove, mostOpen]
      properties:
        hottestPin:
          $ref: "#/components/schemas/Venue"
        fastestMove:
          $ref: "#/components/schemas/Venue"
        mostOpen:
          $ref: "#/components/schemas/Venue"

    MarketGap:
      type: object
      required: [id, title, description]
      properties:
        id: { type: string }
        title: { type: string }
        description: { type: string }

    Comment:
      type: object
      required: [id, venueId, authorName, message, likes, dislikes, createdAt]
      properties:
        id: { type: integer }
        venueId: { type: integer }
        parentCommentId: { type: [integer, "null"] }
        authorName: { type: string }
        message: { type: string }
        likes: { type: integer }
        dislikes: { type: integer }
        createdAt: { type: string, format: date-time }

    CommentInput:
      type: object
      required: [authorName, message]
      properties:
        authorName: { type: string, minLength: 1 }
        message: { type: string, minLength: 1 }
        parentCommentId: { type: [integer, "null"] }

    LiveReport:
      type: object
      required:
        - id
        - venueId
        - reporterName
        - crowdLevel
        - waitTimeMinutes
        - vibeNote
        - createdAt
      properties:
        id: { type: integer }
        venueId: { type: integer }
        reporterName: { type: string }
        crowdLevel:
          type: string
          enum: [open, lively, packed]
        waitTimeMinutes: { type: integer }
        vibeNote: { type: string }
        createdAt: { type: string, format: date-time }

    WatchlistedVenue:
      allOf:
        - $ref: "#/components/schemas/Venue"
        - type: object
          required: [alertsEnabled]
          properties:
            alertsEnabled: { type: boolean }

    WatchlistEntry:
      type: object
      required: [id, userId, venueId, alertsEnabled, createdAt]
      properties:
        id: { type: integer }
        userId: { type: string }
        venueId: { type: integer }
        alertsEnabled: { type: boolean }
        createdAt: { type: string, format: date-time }

    WatchlistAlertsInput:
      type: object
      required: [alertsEnabled]
      properties:
        alertsEnabled: { type: boolean }

    VenueNotification:
      type: object
      required: [id, userId, venueId, venueName, message, crowdLevel, waitTimeMinutes, isRead, createdAt]
      properties:
        id: { type: integer }
        userId: { type: string }
        venueId: { type: integer }
        venueName: { type: string }
        message: { type: string }
        crowdLevel:
          type: string
          enum: [open, lively, packed]
        waitTimeMinutes: { type: integer }
        isRead: { type: boolean }
        createdAt: { type: string, format: date-time }

    MyActivity:
      type: object
      required: [reports, comments]
      properties:
        reports:
          type: array
          items:
            $ref: "#/components/schemas/MyReport"
        comments:
          type: array
          items:
            $ref: "#/components/schemas/MyComment"

    MyReport:
      allOf:
        - $ref: "#/components/schemas/LiveReport"
        - type: object
          required: [venueName]
          properties:
            venueName: { type: string }

    MyComment:
      allOf:
        - $ref: "#/components/schemas/Comment"
        - type: object
          required: [venueName]
          properties:
            venueName: { type: string }

    LiveReportInput:
      type: object
      required: [reporterName, crowdLevel, waitTimeMinutes, vibeNote]
      properties:
        reporterName: { type: string, minLength: 1 }
        crowdLevel:
          type: string
          enum: [open, lively, packed]
        waitTimeMinutes: { type: integer, minimum: 0 }
        vibeNote: { type: string, minLength: 1 }
